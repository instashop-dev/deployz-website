<svg xmlns="http://www.w3.org/2000/svg" width="400" height="670" viewBox="0 0 400 670" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="15" fill="#111111">
  <rect width="400" height="670" fill="#FFFFFF" />

  <!-- Single-tenant SaaS -->
  <text x="8" y="24" font-size="16" font-weight="700">Single-tenant SaaS</text>
  <rect x="8" y="52" width="384" height="112" rx="14" fill="none" stroke="#71717A" stroke-dasharray="5 4" />
  <rect x="22" y="41" width="150" height="22" rx="4" fill="#FFFFFF" stroke="#D4D4D8" />
  <text x="97" y="57" text-anchor="middle" font-size="14" font-weight="600">Your AWS account</text>
  <rect x="28" y="78" width="344" height="66" rx="12" fill="#FFFFFF" stroke="#D4D4D8" />
  <text x="200" y="104" text-anchor="middle" font-weight="600">A dedicated copy for one customer</text>
  <text x="200" y="128" text-anchor="middle" font-size="14" fill="#52525B">You operate it. You pay AWS.</text>

  <!-- BYOC -->
  <text x="392" y="212" text-anchor="end" font-size="16" font-weight="700">BYOC, vendor-operated</text>
  <rect x="20" y="186" width="150" height="44" rx="12" fill="#FFFFFF" stroke="#D4D4D8" />
  <text x="95" y="213" text-anchor="middle" font-weight="600">You (vendor)</text>
  <line x1="95" y1="230" x2="95" y2="312" stroke="#52525B" stroke-width="1.5" />
  <circle cx="95" cy="230" r="3.5" fill="#FFFFFF" stroke="#52525B" stroke-width="1.5" />
  <circle cx="95" cy="312" r="3.5" fill="#FFFFFF" stroke="#52525B" stroke-width="1.5" />
  <text x="108" y="252" font-size="14" fill="#52525B">Operates it through access</text>
  <text x="108" y="270" font-size="14" fill="#52525B">that the customer approves</text>
  <rect x="8" y="290" width="384" height="104" rx="14" fill="none" stroke="#71717A" stroke-dasharray="5 4" />
  <rect x="210" y="279" width="176" height="22" rx="4" fill="#FFFFFF" stroke="#D4D4D8" />
  <text x="298" y="295" text-anchor="middle" font-size="14" font-weight="600">Customer AWS account</text>
  <rect x="28" y="312" width="344" height="62" rx="12" fill="#FFFFFF" stroke="#D4D4D8" />
  <text x="200" y="337" text-anchor="middle" font-weight="600">Your application</text>
  <text x="200" y="360" text-anchor="middle" font-size="14" fill="#52525B">The customer pays AWS.</text>

  <!-- Self-hosted (cloud-account case) -->
  <text x="392" y="432" text-anchor="end" font-size="16" font-weight="700">Self-hosted</text>
  <rect x="20" y="406" width="150" height="44" rx="12" fill="#FFFFFF" stroke="#D4D4D8" />
  <text x="95" y="433" text-anchor="middle" font-weight="600">You (vendor)</text>
  <line x1="95" y1="450" x2="95" y2="532" stroke="#52525B" stroke-width="1.5" />
  <circle cx="95" cy="450" r="3.5" fill="#FFFFFF" stroke="#52525B" stroke-width="1.5" />
  <circle cx="95" cy="532" r="3.5" fill="#FFFFFF" stroke="#52525B" stroke-width="1.5" />
  <text x="108" y="472" font-size="14" fill="#52525B">Ships releases and support,</text>
  <text x="108" y="490" font-size="14" fill="#52525B">no operating access</text>
  <rect x="8" y="510" width="384" height="140" rx="14" fill="none" stroke="#71717A" stroke-dasharray="5 4" />
  <rect x="210" y="499" width="176" height="22" rx="4" fill="#FFFFFF" stroke="#D4D4D8" />
  <text x="298" y="515" text-anchor="middle" font-size="14" font-weight="600">Customer AWS account</text>
  <rect x="28" y="532" width="344" height="98" rx="12" fill="#FFFFFF" stroke="#D4D4D8" />
  <text x="200" y="560" text-anchor="middle" font-weight="600">Your release</text>
  <text x="200" y="586" text-anchor="middle" font-size="14" fill="#52525B">The customer team installs,</text>
  <text x="200" y="606" text-anchor="middle" font-size="14" fill="#52525B">updates and operates it, and pays AWS.</text>
</svg>
