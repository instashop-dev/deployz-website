<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 792" width="400" height="792" role="img" aria-label="Deploy order for a release: inside the customer AWS account, the Deployz connector starts a one-shot migration task, which must exit 0; a non-zero exit updates no service, and a release that is already running keeps serving (on the first start of an install nothing serves yet, and the deployment is marked failed). On exit 0, the connector rolls the ECS services to the new image digest and the load balancer health check runs with a 300-second grace period. The connector heartbeat reports the result to the Deployz control plane, outside the account, which promotes the release only when the rollout is complete, the task counts are full, the targets are healthy and the HTTP probe passed. A dashed, blocked line shows that the connector has no access to the application logs, which stay in the account.">
<rect x="0" y="0" width="400" height="792" fill="#FFFFFF"/>
<rect x="16" y="30" width="368" height="594" rx="14" fill="none" stroke="#71717A" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="32" y="19" width="172" height="22" rx="6" fill="#FFFFFF" stroke="#71717A" stroke-width="1"/>
<text x="44" y="35" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#52525B">Customer AWS account</text>
<rect x="40" y="56" width="304" height="64" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/><text x="56" y="82" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#111111">Deployz connector</text><text x="56" y="104" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#52525B">Starts each step in this account</text>
<line x1="192" y1="120" x2="192" y2="152" stroke="#A1A1AA" stroke-width="1.5"/><circle cx="192" cy="120" r="3" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.5"/><circle cx="192" cy="152" r="3" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.5"/><text x="202" y="141" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#52525B">starts</text>
<rect x="40" y="152" width="304" height="100" rx="12" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1"/><text x="56" y="178" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#111111">Migration task</text><text x="56" y="200" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#52525B">One-shot ECS task, exit 0 required</text><text x="56" y="220" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#52525B">Non-zero exit: no service update,</text><text x="56" y="240" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#52525B">a running release keeps serving</text>
<line x1="192" y1="252" x2="192" y2="284" stroke="#A1A1AA" stroke-width="1.5"/><circle cx="192" cy="252" r="3" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.5"/><circle cx="192" cy="284" r="3" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.5"/><text x="202" y="273" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#52525B">exit 0</text>
<rect x="40" y="284" width="304" height="64" rx="12" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1"/><text x="56" y="310" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#111111">ECS services</text><text x="56" y="332" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#52525B">Rolled to the new image digest</text>
<line x1="192" y1="348" x2="192" y2="380" stroke="#A1A1AA" stroke-width="1.5"/><circle cx="192" cy="348" r="3" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.5"/><circle cx="192" cy="380" r="3" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.5"/><text x="202" y="369" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#52525B">new tasks</text>
<rect x="40" y="380" width="304" height="64" rx="12" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1"/><text x="56" y="406" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#111111">Load balancer health check</text><text x="56" y="428" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#52525B">300-second grace period</text>
<rect x="40" y="528" width="304" height="64" rx="12" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1"/><text x="56" y="554" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#111111">Application logs</text><text x="56" y="576" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#52525B">Stay in this account</text>
<path d="M40 104 H30 V316 H40" fill="none" stroke="#A1A1AA" stroke-width="1.5"/>
<circle cx="40" cy="104" r="3" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.5"/><circle cx="40" cy="316" r="3" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.5"/>
<text x="48" y="273" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#52525B">rolls</text>
<path d="M344 88 H370 V560 H344" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-dasharray="4 4"/>
<circle cx="344" cy="88" r="3" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.5"/><circle cx="344" cy="560" r="3" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.5"/>
<line x1="364" y1="464" x2="376" y2="476" stroke="#71717A" stroke-width="1.5"/>
<line x1="376" y1="464" x2="364" y2="476" stroke="#71717A" stroke-width="1.5"/>
<text x="358" y="508" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#52525B" text-anchor="end">No log access (blocked)</text>
<path d="M40 412 H28 V724 H40" fill="none" stroke="#A1A1AA" stroke-width="1.5"/>
<circle cx="40" cy="412" r="3" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.5"/><circle cx="40" cy="724" r="3" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.5"/>
<text x="48" y="648" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#52525B">Reported by the connector heartbeat</text>
<text x="48" y="672" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#52525B">Deployz control plane</text>
<rect x="40" y="684" width="304" height="84" rx="12" fill="#F0FDF4" stroke="#15803D" stroke-width="1"/>
<text x="56" y="710" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#15803D">Release promoted</text>
<text x="56" y="732" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#52525B">Rollout complete, full task counts,</text>
<text x="56" y="752" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="14" fill="#52525B">targets healthy, HTTP probe passed</text>
</svg>
