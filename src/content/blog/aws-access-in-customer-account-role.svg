<svg xmlns="http://www.w3.org/2000/svg" width="400" height="610" viewBox="0 0 400 610" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="15" fill="#111111">
  <rect width="400" height="610" fill="#FFFFFF" />

  <!-- Vendor account -->
  <rect x="8" y="20" width="384" height="96" rx="14" fill="none" stroke="#71717A" stroke-dasharray="5 4" />
  <rect x="22" y="9" width="152" height="22" rx="4" fill="#FFFFFF" stroke="#D4D4D8" />
  <text x="98" y="25" text-anchor="middle" font-size="14" font-weight="600">Your AWS account</text>
  <rect x="28" y="44" width="344" height="52" rx="12" fill="#FFFFFF" stroke="#D4D4D8" />
  <text x="200" y="76" text-anchor="middle" font-weight="600">Your service's IAM role</text>

  <!-- Connection -->
  <line x1="200" y1="96" x2="200" y2="176" stroke="#52525B" stroke-width="1.5" />
  <circle cx="200" cy="96" r="3.5" fill="#FFFFFF" stroke="#52525B" stroke-width="1.5" />
  <circle cx="200" cy="176" r="3.5" fill="#FFFFFF" stroke="#52525B" stroke-width="1.5" />
  <text x="212" y="128" font-size="14" fill="#52525B">AssumeRole with the</text>
  <text x="212" y="146" font-size="14" fill="#52525B">customer's external ID</text>
  <text x="188" y="128" text-anchor="end" font-size="14" fill="#52525B">AWS STS returns</text>
  <text x="188" y="146" text-anchor="end" font-size="14" fill="#52525B">temporary credentials</text>

  <!-- Customer account -->
  <rect x="8" y="164" width="384" height="426" rx="14" fill="none" stroke="#71717A" stroke-dasharray="5 4" />
  <rect x="22" y="153" width="180" height="22" rx="4" fill="#FFFFFF" stroke="#D4D4D8" />
  <text x="112" y="169" text-anchor="middle" font-size="14" font-weight="600">Customer AWS account</text>

  <rect x="28" y="190" width="344" height="94" rx="12" fill="#FFFFFF" stroke="#D4D4D8" />
  <text x="200" y="216" text-anchor="middle" font-weight="600">Cross-account role</text>
  <text x="200" y="242" text-anchor="middle" font-size="14" fill="#52525B">Trust policy condition:</text>
  <text x="200" y="264" text-anchor="middle" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111111">sts:ExternalId</text>

  <line x1="200" y1="284" x2="200" y2="330" stroke="#52525B" stroke-width="1.5" />
  <circle cx="200" cy="284" r="3.5" fill="#FFFFFF" stroke="#52525B" stroke-width="1.5" />
  <circle cx="200" cy="330" r="3.5" fill="#FFFFFF" stroke="#52525B" stroke-width="1.5" />
  <text x="212" y="312" font-size="14" fill="#52525B">Creates and updates</text>

  <rect x="28" y="330" width="344" height="150" rx="12" fill="#FAFAFA" stroke="#D4D4D8" />
  <text x="200" y="356" text-anchor="middle" font-weight="600">Your application's resources</text>
  <rect x="48" y="374" width="304" height="86" rx="12" fill="#FFFFFF" stroke="#D4D4D8" />
  <text x="200" y="400" text-anchor="middle" font-size="14" font-weight="600">IAM roles your stack creates</text>
  <text x="200" y="424" text-anchor="middle" font-size="14" fill="#52525B">Limited by a permissions boundary</text>
  <text x="200" y="444" text-anchor="middle" font-size="14" fill="#52525B">and by tags</text>

  <rect x="28" y="500" width="344" height="70" rx="12" fill="#FFFFFF" stroke="#D4D4D8" />
  <text x="200" y="528" text-anchor="middle" font-weight="600">CloudTrail</text>
  <text x="200" y="552" text-anchor="middle" font-size="14" fill="#52525B">Records the calls the role makes</text>
</svg>
